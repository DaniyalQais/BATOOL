project_id = "batool-local"

[functions.validate-product-image]
# JWTs are verified explicitly through Auth getUser(), including signing-key rotation.
# This does NOT make the endpoint unauthenticated: the handler fails closed.
verify_jwt = false
entrypoint = "./functions/validate-product-image/index.ts"
# Pinned decoder is fetched from a private immutable Storage object, length/hash
# checked and initialized server-side. No 15 MB static binary in this bundle.

[functions.secure-checkout]
# Prepared only, not deployed. Guest scopes are signed and checked by the handler.
# Browser Auth/metadata cannot call the service-only database RPCs.
verify_jwt = false
entrypoint = "./functions/secure-checkout/index.ts"
